name: Build Frontend

on:
  workflow_call:
    inputs:
      image_tag:
        type: string
        required: true
      registry:
        type: string
        default: 'ghcr'
      api_url:
        type: string
        required: true
      registry_owner:
        type: string
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: inputs.registry == 'ghcr'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Authenticate to GCP
        if: inputs.registry == 'gcp'
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}
          token_format: access_token

      - name: Log in to GCP Artifact Registry
        if: inputs.registry == 'gcp'
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.GCP_AR_HOST }}
          username: oauth2accesstoken
          password: ${{ steps.gcp-auth.outputs.access_token }}

      - name: Debug inputs
        run: |
          echo "registry: ${{ inputs.registry }}"
          echo "registry_owner: ${{ inputs.registry_owner }}"
          echo "image_tag: ${{ inputs.image_tag }}"

      - name: Set image name
        id: image
        run: |
          if [ "${{ inputs.registry }}" = "ghcr" ]; then
            echo "name=ghcr.io/${{ inputs.registry_owner }}/frontend" >> $GITHUB_OUTPUT
          else
            echo "name=${{ secrets.GCP_AR_HOST }}/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_AR_REPO }}/frontend" >> $GITHUB_OUTPUT
          fi

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ inputs.image_tag }}
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ inputs.api_url }}
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
            NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          cache-from: type=gha,scope=frontend
