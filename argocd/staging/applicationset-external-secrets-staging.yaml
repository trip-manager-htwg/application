apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: trip-manager-external-secrets-staging
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/trip-manager-htwg/gitops.git
        revision: main
        directories:
          - path: staging/external-secrets
  template:
    metadata:
      name: 'staging-external-secrets'
      namespace: argocd
    spec:
      project: default
      source:
        repoURL: https://github.com/trip-manager-htwg/gitops.git
        targetRevision: main
        path: '{{path}}'
        directory:
          recurse: true
      destination:
        server: https://kubernetes.default.svc
        namespace: external-secrets
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true