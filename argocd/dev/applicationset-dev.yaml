apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: trip-manager-dev
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/trip-manager-htwg/gitops.git
        revision: main
        directories:
          - path: dev/*
          - path: dev/external-secrets
            exclude: true
          - path: dev/cluster-config
            exclude: true
  template:
    metadata:
      name: 'dev-{{path.basename}}'
      namespace: argocd
    spec:
      project: default
      source:
        repoURL: https://github.com/trip-manager-htwg/gitops.git
        targetRevision: main
        path: '{{path}}'
        directory:
          recurse: true
      destination:
        server: https://kubernetes.default.svc
        namespace: trip-manager-dev
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true