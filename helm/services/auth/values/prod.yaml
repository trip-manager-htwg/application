image:
  pullPolicy: Always

replicaCount: 2

service:
  healthPath: /health

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 3

env:
  - name: PORT
    value: "8082"
  - name: LOG_LEVEL
    value: "info"
  - name: CORS_ALLOWED_ORIGINS
    value: "https://www.neatnode.xyz,https://neatnode.xyz"
  - name: OTEL_COLLECTOR_ENDPOINT
    value: "otel-collector.trip-manager-prod.svc.cluster.local:4317"

externalSecrets:
  enabled: true
  secrets:
    - secretKey: FIREBASE_PROJECT_ID
      remoteKey: project-id

envFrom:
  - secretRef:
      name: auth-secrets

serviceAccount:
  gcpServiceAccount: "auth-sa@ornate-reef-501614-a1.iam.gserviceaccount.com"

