apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull-secret
  namespace: trip-manager-prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: ghcr-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"username":"trip-manager-htwg","password":"{{ "{{ .token }}" }}","auth":"{{ "{{ printf \"%s:%s\" \"trip-manager-htwg\" .token | b64enc }}" }}"}}}
  data:
    - secretKey: token
      remoteRef:
        key: github-pat-packages